<!doctype html>
<html lang="{{DEFAULT_LANG}}" data-default-lang="{{DEFAULT_LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{BRAND_NAME_EN}} — {{TAGLINE_EN}}</title>
  <meta name="description" content="{{DESCRIPTION_EN}}">
  <meta name="theme-color" content="{{THEME_COLOR}}">
  <link rel="canonical" href="https://{{DOMAIN}}/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{BRAND_NAME_EN}}">
  <meta property="og:title" content="{{BRAND_NAME_EN}} — {{TAGLINE_EN}}">
  <meta property="og:description" content="{{DESCRIPTION_EN}}">
  <meta property="og:image" content="https://{{DOMAIN}}/img/og-cover.png">
  <meta property="og:url" content="https://{{DOMAIN}}/">
  <meta property="og:locale" content="bn_BD">
  <meta property="og:locale:alternate" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{BRAND_NAME_EN}} — {{TAGLINE_EN}}">
  <meta name="twitter:description" content="{{DESCRIPTION_EN}}">
  <meta name="twitter:image" content="https://{{DOMAIN}}/img/og-cover.png">
  <link rel="alternate" hreflang="bn" href="https://{{DOMAIN}}/?lang=bn">
  <link rel="alternate" hreflang="en" href="https://{{DOMAIN}}/?lang=en">
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/img/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/store.css?v={{BUILD_ID}}">
  <link rel="modulepreload" href="/js/app.js?v={{BUILD_ID}}">
  <script type="application/ld+json">{{JSONLD_STORE}}</script>
</head>
<body>
  <a class="skip" href="#main" data-i18n="skipToContent">Skip to content</a>
  <div class="announce" id="announce" hidden></div>

  <header class="site-header" id="site-header">
    <div class="container header-row">
      <a class="logo" href="/" aria-label="{{BRAND_NAME_EN}} home">
        <img src="/img/logo.svg" alt="" width="44" height="44" id="logo-img">
        <span class="logo-text"><b id="brand-name">{{BRAND_NAME_EN}}</b><small id="brand-tagline">{{TAGLINE_EN}}</small></span>
      </a>
      <form class="search-bar" role="search" id="search-form">
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        <label class="sr-only" for="search-input" data-i18n="search">Search</label>
        <input id="search-input" type="search" name="q" autocomplete="off" data-i18n-placeholder="searchPlaceholder">
      </form>
      <div class="header-tools">
        <div class="lang-toggle" role="group" aria-label="Language / ভাষা">
          <button type="button" data-lang="bn" aria-pressed="false">বাং</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <a class="icon-btn hide-mobile" href="/account" data-i18n-label="account"><svg class="icon"><use href="#i-user"/></svg></a>
        <a class="icon-btn hide-mobile" href="/account/wishlist" data-i18n-label="wishlist"><svg class="icon"><use href="#i-heart"/></svg></a>
        <button class="icon-btn cart-btn" type="button" id="cart-btn" data-i18n-label="cart"><svg class="icon"><use href="#i-bag"/></svg><span class="badge-dot" id="cart-count" hidden>0</span></button>
      </div>
    </div>
    <nav class="main-nav container" id="main-nav" aria-label="Main"></nav>
  </header>

  <main id="main" tabindex="-1"></main>

  <footer class="site-footer" id="footer"></footer>

  <nav class="bottom-nav" id="bottom-nav" aria-label="Quick"></nav>
  <a class="wa-float" id="wa-float" href="/wa" data-i18n-label="chatWhatsApp"><svg class="icon"><use href="#i-whatsapp"/></svg></a>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <div id="overlay-root"></div>

  <noscript><div class="container section"><p>Please enable JavaScript to shop. Call us: <a href="tel:{{PHONE}}">{{PHONE}}</a></p></div></noscript>

  <!-- Icon sprite (inline so icons render with no extra requests on slow networks) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></symbol>
    <symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></symbol>
    <symbol id="i-truck" viewBox="0 0 24 24"><path d="M3 6h11v10H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
    <symbol id="i-cash" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="3"/><circle cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 5 3 8 7 10 4-2 7-5 7-10V6z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-gift" viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="11" rx="2"/><path d="M3 9h18v-3H3zM12 6v14M12 6c-2-4-7-3-5 0M12 6c2-4 7-3 5 0"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 4 2.4 5 5.6.8-4 3.9 1 5.5-5-2.7-5 2.7 1-5.5-4-3.9 5.6-.8z"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></symbol>
    <symbol id="i-whatsapp" viewBox="0 0 24 24"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8a4 4 0 0 1-1.8-1.8l.8-1-1-2z"/></symbol>
    <symbol id="i-facebook" viewBox="0 0 24 24"><path d="M14 8h3V4h-3a4 4 0 0 0-4 4v3H7v4h3v7h4v-7h3l1-4h-4V8z"/></symbol>
    <symbol id="i-instagram" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
    <symbol id="i-ruler" viewBox="0 0 24 24"><path d="M3 17 17 3l4 4L7 21z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-return" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></symbol>
    <symbol id="i-baby" viewBox="0 0 24 24"><circle cx="12" cy="11" r="7"/><path d="M9.5 10h.01M14.5 10h.01M10 14c1 1 3 1 4 0M12 4c0-1 1-2 2-1"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></symbol>
  </svg>

  <script type="module" src="/js/app.js?v={{BUILD_ID}}"></script>
</body>
</html>
