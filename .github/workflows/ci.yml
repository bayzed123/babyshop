# CI — runs on every push and pull request. When it passes on main, the Deploy workflow publishes the shop.
#
#   build → TypeScript check → unit + integration tests (Workers runtime, local D1/KV/R2)
#         → Playwright E2E (storefront checkout + admin call logging, mobile and desktop)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (storefront, admin, seed SQL)
        run: node scripts/build.mjs
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Check scripts parse
        run: for f in scripts/*.mjs; do node --check "$f"; done
      - name: Unit & integration tests (Workers runtime + local D1/KV/R2)
        run: npx vitest run
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (storefront + admin, mobile + desktop)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
